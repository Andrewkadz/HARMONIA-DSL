<!DOCTYPE html>
<html>
  <head>
    <title>Holo-Swarm: ANIMUS Visualizer</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene xr-mode-ui="enabled: true">
      <!-- Assets -->
      <a-assets>
        <a-mixin id="agent-orb" geometry="primitive: sphere; radius: 0.05" material="color: #00FFFF; shader: standard; metalness: 0.5; roughness: 0.2"></a-mixin>
      </a-assets>

      <!-- Environment (Only visible in VR, hidden in AR Passthrough) -->
      <a-entity environment="preset: tron; grid: none; skyType: atmosphere; lighting: none" hide-in-ar-mode></a-entity>

      <!-- The Swarm Container -->
      <a-entity id="swarm-container" position="0 0 0"></a-entity>

      <!-- HUD / Stats Panel -->
      <a-entity position="0 1.6 -1.5" rotation="-10 0 0">
        <a-plane width="1.5" height="0.6" color="#000" opacity="0.7">
            <a-text id="stats-text" value="Connecting to ANIMUS..." align="center" width="4" position="0 0 0.01"></a-text>
        </a-plane>
        <!-- Interaction Button -->
        <a-entity position="0 -0.4 0" geometry="primitive: box; width: 0.5; height: 0.15; depth: 0.05" material="color: #FF0055" 
                  class="clickable"
                  animation__click="property: scale; startEvents: click; from: 1 1 1; to: 0.9 0.9 0.9; dur: 100; dir: alternate">
            <a-text value="PERTURB SWARM" align="center" width="3" position="0 0 0.03"></a-text>
        </a-entity>
      </a-entity>

      <!-- Lighting -->
      <a-light type="ambient" color="#222"></a-light>
      <a-light type="point" position="2 4 2" intensity="0.8" color="#FFF"></a-light>

      <!-- Camera / Controllers -->
      <a-entity id="rig">
        <a-camera position="0 1.6 0"></a-camera>
        <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 5"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 5"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      // Connect to WebSocket
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;
      const ws = new WebSocket(wsUrl);
      
      const container = document.getElementById('swarm-container');
      const statsText = document.getElementById('stats-text');
      const agents = {}; // Map ID -> A-Frame Entity

      ws.onopen = () => {
        statsText.setAttribute('value', 'Connected to ANIMUS Engine.\nWaiting for data...');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        
        if (data.type === 'update') {
            // Update Stats
            const coherence = data.coherence.toFixed(3);
            const energy = data.energy.toFixed(1);
            statsText.setAttribute('value', `ANIMUS (Coherence): ${coherence}\nEnergy: ${energy}\nAgents: ${data.agents.length}`);
            
            // Color Logic based on Coherence
            // High Coherence = Gold/White
            // Low Coherence = Red/Chaos
            let color = '#00FFFF'; // Default Cyan
            if (data.coherence > 0.9) color = '#FFD700'; // Gold
            else if (data.coherence < 0.6) color = '#FF0000'; // Red
            
            // Update Agents
            data.agents.forEach(agentData => {
                let el = agents[agentData.id];
                
                // Create if new
                if (!el) {
                    el = document.createElement('a-entity');
                    el.setAttribute('mixin', 'agent-orb');
                    container.appendChild(el);
                    agents[agentData.id] = el;
                }
                
                // Update Position (Smooth interpolation handled by 60fps updates)
                el.setAttribute('position', {
                    x: agentData.x,
                    y: agentData.y,
                    z: agentData.z
                });
                
                // Update Color/Scale based on individual phase
                // Pulse size with phase
                const scale = 1.0 + 0.3 * Math.sin(agentData.psi);
                el.setAttribute('scale', {x: scale, y: scale, z: scale});
                el.setAttribute('material', 'color', color);
            });
        }
      };

      // Handle Button Click (Perturb)
      document.querySelector('.clickable').addEventListener('click', () => {
        ws.send(JSON.stringify({action: 'perturb'}));
      });
      
      // AR Passthrough Logic
      const scene = document.querySelector('a-scene');
      scene.addEventListener('enter-vr', () => {
        if (scene.is('ar-mode')) {
            // Hide environment in AR
            document.querySelector('[environment]').setAttribute('visible', false);
        }
      });
    </script>
  </body>
</html>
